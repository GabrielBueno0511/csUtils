<nav class="account-bar" aria-label="Conta">
  <a routerLink="/" class="account-brand" aria-label="CS Utils — início">
    <img src="brand/csutils-mark.svg" alt="" width="40" height="40" />
    <span class="account-brand__text"><strong>CS <em>UTILS</em></strong><small>ARQUIVO TÁTICO / CS2</small></span>
  </a>
  <div class="account-links">
    <a routerLink="/" [queryParams]="{ tab: 'favorites' }">Favoritos</a>
    @if (auth.user(); as user) {
      <span>Olá, {{ user.name }}</span>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/users">Usuários</a>
        <a routerLink="/admin/spots">Spots</a>
      }
      <button type="button" (click)="logout()" [disabled]="logoutBusy()">{{ logoutBusy() ? 'Saindo…' : 'Sair' }}</button>
    } @else {
      <a routerLink="/login">Entrar</a>
      <a routerLink="/register" class="account-register">Criar conta</a>
    }
  </div>
</nav>
@if (authError()) { <p class="account-error" role="alert">{{ authError() }}</p> }
<router-outlet />
